<style>
:root{--creme:#f7f1e6;--feu:#c4561f;--bleu:#2f6d9e;--or:#bd8a3e;--brun:#1c140f;--brun2:#3a2c20;--vert:#5f6b3e;--ligne:#e0d4bd;--acc:#c4561f;}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--brun)}
body{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 0;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;background:#e9e3d6;transition:grid-template-columns .24s ease}
body.panel-open{grid-template-columns:minmax(360px,1fr) minmax(360px,460px)}
#map{grid-column:1;grid-row:2;min-height:0;position:relative;background:#e9e3d6}
.leaflet-tooltip.s-tip{background:#fffdf8;border:1px solid var(--ligne);border-radius:10px;box-shadow:0 6px 18px rgba(28,20,15,.18);padding:0;width:300px;max-width:min(340px,82vw);white-space:normal}
.tip-min{padding:8px 11px}.tip-min .tip-line{margin-top:3px}
.tip-in{padding:10px 12px}.tip-in img{height:170px;object-fit:cover;border-radius:8px 8px 0 0;display:block;margin:-10px -12px 10px;max-width:none;width:calc(100% + 24px)}
.tip-nm{font-weight:700;font-size:15px;line-height:1.25}.tip-sub{font-size:12.5px;font-weight:600;margin-top:2px}
.tip-line{font-size:12.5px;color:var(--brun2);margin-top:5px;line-height:1.45}
@media(max-width:600px){.leaflet-tooltip.s-tip{width:260px;max-width:82vw}}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 8px;margin-top:5px}
#topbar{grid-column:1/-1;grid-row:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:linear-gradient(135deg,#1c140f,#3a2c20);color:var(--creme);padding:9px 14px;box-shadow:0 2px 10px rgba(28,20,15,.2);z-index:1000}
#topbar .k{letter-spacing:.12em;text-transform:uppercase;font-size:11px;font-weight:700;color:var(--or);white-space:nowrap}
#search{flex:1 1 200px;min-width:150px;border:0;border-radius:8px;padding:7px 11px;font-size:13px}
#count{font-size:11.5px;color:#cdbb9b;white-space:nowrap}
#fav-line{font-size:11.5px;color:#cdbb9b;white-space:nowrap}
#filters{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}
#filters label{display:flex;align-items:center;gap:5px;cursor:pointer;color:#e4d8c0}
#recenter{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;background:rgba(255,255,255,.12);color:var(--creme);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600}
#recenter:hover{background:rgba(255,255,255,.22)}
#legend{grid-column:1/-1;grid-row:3;display:flex;flex-wrap:wrap;align-items:center;gap:5px 15px;background:#fffdf8;border-top:1px solid var(--ligne);padding:8px 14px;font-size:12px;z-index:1000}
#legend .lg-item{display:inline-flex;align-items:center;gap:6px;color:var(--brun2)}
#legend .lg-lab{text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;font-weight:700;color:#8a6a1f}
#legend .lg-note{color:#8c7a63;font-size:11px}
#legend .ldot{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);flex:none}
#panel{grid-column:2;grid-row:2;position:relative;z-index:900;width:100%;min-width:0;height:100%;max-width:none;background:#fffdf8;box-shadow:none;border-left:1px solid transparent;overflow:hidden;transition:border-color .24s ease,box-shadow .24s ease}
#panel.open{border-left-color:var(--ligne);box-shadow:-8px 0 22px rgba(28,20,15,.10);overflow-y:auto}
#panel .hero{position:relative;height:176px;background:#2e231a;overflow:hidden}
#hero-img{height:100%}
#panel .hero img{width:100%;height:100%;object-fit:contain;display:block;background:#d7e3ef}
#panel .hero .ph{display:flex;align-items:center;justify-content:center;height:100%;color:#8c7a63;font-size:13px}
#panel .close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
#panel .body{padding:16px 18px 34px}
#panel h2{margin:0 0 2px;font-size:20px;line-height:1.15}#panel .loc{color:var(--acc);font-weight:600;font-size:13px;margin-bottom:10px}
#panel .pot{display:inline-block;font-weight:700;border-radius:6px;padding:2px 9px;font-size:12px;margin-bottom:12px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.sheet-title{min-width:0}.sheet-actions{display:flex;gap:6px;flex:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--ligne);border-radius:8px;background:#fff;color:var(--brun2);cursor:pointer;text-decoration:none;font-weight:800}
.icon-btn:hover{border-color:var(--or);color:#8a6a1f;background:#fbf5ea}
.status-row{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.status-pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;border:1px solid transparent}
.status-priority{background:#f4dfc8;color:#8b3c14;border-color:#e7c09d}.status-hot{background:#edf3e6;color:#4e6936;border-color:#d5e2c8}.status-wait{background:#eef1f5;color:#546579;border-color:#d8dee6}.status-open{background:#f7f0df;color:#8a6a1f;border-color:#e8dcc2}.status-out{background:#f1eeee;color:#786b63;border-color:#ded6cf}
.summary-box{background:#fff;border:1px solid var(--ligne);border-left:3px solid var(--acc);border-radius:8px;padding:10px 12px;margin:10px 0 12px;font-size:13.5px;line-height:1.45;color:var(--brun2)}
.section-title{margin:16px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#7e6c55}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 12px}
.metric{border:1px solid var(--ligne);border-radius:8px;background:#fff;padding:8px 9px;min-height:54px}
.metric b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#766957;margin-bottom:5px}
.meter{display:flex;gap:3px;margin-bottom:2px}.meter i{height:5px;flex:1;border-radius:99px;background:#e8dfd0}.meter.l1 i:nth-child(-n+1){background:#a9553c}.meter.l2 i:nth-child(-n+2){background:#bd8a3e}.meter.l3 i:nth-child(-n+3){background:#5f6b3e}.meter.l0 i{background:#eee8dc}
.metric span{font-size:12px;color:#7d6f60}
.info-grid{display:grid;grid-template-columns:1fr;gap:6px;margin:0 0 12px}
.info-line{display:grid;grid-template-columns:118px 1fr;gap:9px;font-size:13px;line-height:1.35;padding:7px 0;border-bottom:1px solid #eee5d6}
.info-line b{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#806f5b}.info-line span{color:var(--brun2)}
.next-action{border:1px solid #e0c99e;background:#fff8ea;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:13px;line-height:1.4}
.next-action b{display:block;text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:#8a6a1f;margin-bottom:4px}
.score-card{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border:1px solid var(--ligne);background:#fff;border-radius:8px;padding:10px 12px;margin:10px 0 12px}
.score-num{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f6ead5;color:#8b3c14;font-weight:900;font-size:18px;border:1px solid #e7c09d}
.score-copy{font-size:13px;line-height:1.35;color:var(--brun2)}.score-copy b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8a6a1f;margin-bottom:3px}
.criteria-list{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.criterion{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;border:1px solid var(--ligne);background:#fff;border-radius:8px;padding:8px 9px;font-size:12.5px;line-height:1.35}
.criterion-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fbf5ea;color:#8a6a1f;font-weight:900;font-size:11px}
.criterion-main b{display:block;color:var(--brun);font-size:12.5px;margin-bottom:2px}.criterion-main span{color:#776b5d}
.criterion-note{font-weight:900;border-radius:999px;padding:2px 7px;background:#eee8dc;color:#6d6258;font-size:11px;white-space:nowrap}
.criterion-note.ok{background:#edf3e6;color:#4e6936}.criterion-note.mid{background:#fff4dc;color:#8a6a1f}.criterion-note.low{background:#f7e8e1;color:#9a3d25}.criterion-note.unknown{background:#eef1f5;color:#546579}
.kv{font-size:13.5px;margin:8px 0;line-height:1.45}.kv b{text-transform:uppercase;font-size:11px;letter-spacing:.04em;display:block;color:var(--vert)}
.anl{background:#fbf5ea;border:1px solid var(--ligne);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:13px}
.anl h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}.anl.pf h4{color:var(--vert)}.anl.lm h4{color:#a23b2b}
.anl ul{margin:0;padding-left:18px}.anl li{margin:2px 0}
#wx{font-size:13px;color:var(--brun2);line-height:1.5;margin-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btns a{background:var(--acc);color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:12.5px}
.btns a.alt{background:#2e231a}.btns a.gr{background:var(--vert)}
.team-thread{border-top:1px solid var(--ligne);margin-top:18px;padding-top:14px}
.thread-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.thread-head h3{margin:0;font-size:16px}.thread-mode{font-size:11px;color:#8c7a63}
.comment-list{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.comment{background:#fff;border:1px solid var(--ligne);border-radius:8px;padding:9px 10px;font-size:13px;line-height:1.42}
.comment-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:#897a67;font-size:11px;margin-bottom:4px}
.comment-kind{font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:#8a6a1f}.comment-kind.decision{color:#8b3c14}.comment-kind.action{color:#4e6936}.comment-kind.question{color:#2f6d9e}.comment-kind.source{color:#6b5b8e}
.mention{font-weight:800;color:#2f6d9e;background:#edf4fa;border-radius:5px;padding:0 3px}
.comment-empty{font-size:12.5px;color:#8c7a63;background:#fbf5ea;border:1px dashed var(--ligne);border-radius:8px;padding:10px}
.comment-form{background:#fff;border:1px solid var(--ligne);border-radius:8px;padding:9px}
.comment-tools{display:flex;gap:7px;margin-bottom:8px}.comment-tools select{border:1px solid var(--ligne);border-radius:7px;background:#fffdf8;padding:6px 8px;font-size:12px;color:var(--brun2)}
.comment-form textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--ligne);border-radius:7px;padding:8px;font:13px/1.45 inherit;color:var(--brun);background:#fffdf8}
.comment-form textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(189,138,62,.15)}
.comment-submit{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.comment-hint{font-size:11.5px;color:#8c7a63}.comment-submit button{border:0;border-radius:7px;background:var(--acc);color:#fff;font-weight:800;font-size:12px;padding:8px 12px;cursor:pointer}
.mention-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.mention-chips button{border:1px solid var(--ligne);background:#fbf5ea;color:#6d5e4b;border-radius:999px;font-size:11px;padding:3px 7px;cursor:pointer}
.pnav{position:absolute;top:50%;transform:translateY(-50%);z-index:6;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:24px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center}
.pnav:hover{background:rgba(0,0,0,.7)}
#ph-prev{left:10px}#ph-next{right:10px}
#ph-count{position:absolute;bottom:8px;right:12px;z-index:6;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:12px;padding:2px 9px;display:none}
@media(max-width:760px){body,body.panel-open{grid-template-columns:1fr}#panel{position:fixed;grid-column:auto;grid-row:auto;top:auto;right:0;bottom:0;left:0;width:100%;max-width:100vw;height:82%;border-radius:14px 14px 0 0;transform:translateY(105%);border-left:0;border-top:1px solid var(--ligne);transition:transform .24s ease,box-shadow .24s ease}#panel.open{width:100%;transform:translateY(0);box-shadow:0 -8px 22px rgba(28,20,15,.16);overflow-y:auto}}
@media(max-width:720px){.metrics{grid-template-columns:1fr}.info-line{grid-template-columns:104px 1fr}#topbar{max-width:none}}
#filters .fav-toggle{color:#f0d9a8;font-weight:700}
#fav-line{margin-top:5px;font-size:11px;color:#cdbb9b}
.fav-btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--or);background:#fff;color:var(--or);border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px;margin:2px 0 12px;transition:background .15s,color .15s}
.fav-btn:hover{background:#fbf3e1}
.fav-btn.on{background:var(--or);color:#fff}
.fav-btn .st{font-size:15px;line-height:1}
.fav-who{font-size:11.5px;color:#8c7a63;margin:-6px 0 12px}
.leaflet-tooltip.s-tip .fav-tag{display:inline-block;font-size:10px;font-weight:700;color:#8a6a1f;background:#f3e3bd;border-radius:10px;padding:0 7px;margin-top:4px}
</style></head><body>

<script>
var DATA = [];
var QUALIF_LOADED=false;
var COLS = { s:"#c4561f", a:"#2f6d9e", v:"#3c7a4e" };
function rad(imp){ return 5 + imp*1.7; }
var map=L.map('map',{zoomControl:true}).setView([46.9,2.2],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
 attribution:'&copy; OpenStreetMap, &copy; CARTO',maxZoom:19,subdomains:'abcd'}).addTo(map);

var wikiCache={};
function wikiFetch(title,commune){
 if(!title) return Promise.resolve(null);
 var key=title+'|'+commune;
 if(wikiCache[key]) return wikiCache[key];
 var base='https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages%7Cextracts&piprop=thumbnail&pithumbsize=700&exintro=1&explaintext=1&redirects=1';
 function parse(j){try{var pg=j.query.pages;var k=Object.keys(pg)[0];if(k==='-1')return null;var p=pg[k];return{title:p.title,thumb:p.thumbnail?p.thumbnail.source:null,extract:p.extract||''};}catch(e){return null;}}
 var p=fetch(base+'&titles='+encodeURIComponent(title)).then(r=>r.json()).then(parse)
  .then(res=>{ if(res&&res.thumb) return res;
     var q=encodeURIComponent(title+' '+(commune||''));
     return fetch(base+'&generator=search&gsrlimit=1&gsrsearch='+q).then(r=>r.json()).then(parse).then(r2=>r2||res); })
  .catch(()=>null);
 wikiCache[key]=p; return p;
}
function trim(t,n){ if(!t) return ''; t=t.trim(); return t.length>n? t.slice(0,n).replace(/\s+\S*$/,'')+'…':t; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
var CAD={v:'en ville',b:'village / bourg',c:'pleine campagne'};
var CADL={v:'En ville',b:'Dans un village / bourg',c:'En pleine campagne'};
function inf(x){return x && x.toLowerCase().indexOf('non précisé')!==0;}

/* ---- Carrousel photos du panneau ---- */
var PH={list:[],i:0,key:null};
function showPh(msg){
 var hero=document.getElementById('hero-img');
 var pc=document.getElementById('ph-count'), pv=document.getElementById('ph-prev'), nx=document.getElementById('ph-next');
 if(!PH.list.length){ hero.innerHTML='<div class="ph">'+(msg||'Chargement des photos…')+'</div>'; pc.style.display='none'; pv.style.display='none'; nx.style.display='none'; return; }
 hero.innerHTML='<img src="'+PH.list[PH.i]+'" alt="" onerror="phErr()">';
 var multi=PH.list.length>1;
 pc.textContent=(PH.i+1)+' / '+PH.list.length; pc.style.display=multi?'block':'none';
 pv.style.display=multi?'flex':'none'; nx.style.display=multi?'flex':'none';
 if(multi){ var pre=new Image(); pre.src=PH.list[(PH.i+1)%PH.list.length]; }
}
function phMove(d){ if(PH.list.length<2) return; PH.i=(PH.i+d+PH.list.length)%PH.list.length; showPh(); }
function phErr(){ if(!PH.list.length) return; PH.list.splice(PH.i,1); if(PH.i>=PH.list.length) PH.i=0; showPh('Pas de photo disponible — voir « Source »'); }
function hideImg(el){ el.style.display='none'; }
var photoCache={};
function photosFor(it){
 if(photoCache[it.n]) return photoCache[it.n];
 var out=[];
 if(it.img) out.push(it.img);
 var p=wikiFetch(it.w,it.c).then(function(w){
   if(w&&w.thumb&&out.indexOf(w.thumb)<0) out.push(w.thumb);
   var t=(w&&w.title)?w.title:it.w;
   var u1='https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=images&gimlimit=25&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=900&titles='+encodeURIComponent(t);
   var u2='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=geosearch&ggscoord='+it.lat+'%7C'+it.lng+'&ggsradius=800&ggslimit=25&ggsnamespace=6&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=900';
   function pull(j){ var r=[]; try{ Object.keys(j.query.pages).forEach(function(k){ var pg=j.query.pages[k]; var ii=pg.imageinfo&&pg.imageinfo[0]; if(!ii||ii.mime!=='image/jpeg') return; var n=(pg.title||'').toLowerCase(); if(/blason|logo|carte |map|drapeau|flag|icon|wappen|plan de/.test(n)) return; r.push(ii.thumburl||ii.url); }); }catch(e){} return r; }
   var u3='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=20&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=900&gsrsearch='+encodeURIComponent(it.n+' '+it.c);
   var reqs=[fetch(u1).then(function(r){return r.json();}).then(pull)['catch'](function(){return [];})];

function applyThumb(it,src){ it._thumb=src; it._m.setTooltipContent(tipHtml(it,src)); var im=new Image(); im.src=src; }
function fallbackThumb(it){ wikiFetch(it.w,it.c).then(function(w){ if(w&&w.thumb&&!it._thumb) applyThumb(it,w.thumb); }); }
function prefetchThumbs(){
 var byTitle={};
 DATA.forEach(function(it){ (byTitle[it.w]=byTitle[it.w]||[]).push(it); });
 var titles=Object.keys(byTitle), chunks=[];
 for(var i=0;i<titles.length;i+=50) chunks.push(titles.slice(i,i+50));
 var base='https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=700&redirects=1';
 chunks.reduce(function(seq,ch){ return seq.then(function(){
   return fetch(base+'&titles='+encodeURIComponent(ch.join('|'))).then(function(r){return r.json();}).then(function(j){
     var norm={},red={},byT={};
     (j.query.normalized||[]).forEach(function(x){norm[x.from]=x.to;});
     (j.query.redirects||[]).forEach(function(x){red[x.from]=x.to;});
     Object.keys(j.query.pages).forEach(function(k){ var p=j.query.pages[k]; byT[p.title]=p; });
     ch.forEach(function(t){ var f=norm[t]||t; f=red[f]||f; var p=byT[f];
       var th=(p&&p.thumbnail)?p.thumbnail.source:null;
       byTitle[t].forEach(function(it){
         if(it.img){ if(!it._thumb) applyThumb(it,it.img); }
         else if(th){ applyThumb(it,th); }
         else { fallbackThumb(it); }
       });
     });
   })['catch'](function(){});
 });}, Promise.resolve());
}

function saveCmtStore(s){ try{localStorage.setItem(CMT_LS_KEY,JSON.stringify(s));}catch(e){} }
function kindLabel(k){ return {observation:'Observation',question:'Question',decision:'Décision',action:'Action',source:'Source'}[k]||'Observation'; }
function fmtDate(s){ try{return new Date(s).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '';} }
function initials(email){ var x=(email||'local').split('@')[0].replace(/[._-]+/g,' ').trim(); return x||'local'; }
function parseMentions(t){
 var out=[], re=/@([A-Za-zÀ-ÿ0-9._-]+)/g, m;
 while((m=re.exec(t||''))){ if(out.indexOf(m[1])<0) out.push(m[1]); }
 return out;
}
function linkMentions(t){
 return esc(t).replace(/@([A-Za-zÀ-ÿ0-9._-]+)/g,'<span class="mention">@$1</span>').replace(/\n/g,'<br>');
}
function memberSuggestions(){
 var set={};
 if(ME) set[initials(ME)]=true;
 Object.keys(FAV).forEach(function(k){ (FAV[k]||[]).forEach(function(e){ if(e&&e!=='local') set[initials(e)]=true; }); });
 ['Benoit','Raphael','Emmanuel'].forEach(function(x){set[x]=true;});
 return Object.keys(set).slice(0,8);
}
function threadHtml(it){
 return '<div class="team-thread">'+
  '<div class="thread-head"><h3>Échanges équipe</h3><span class="thread-mode" id="thread-mode">chargement…</span></div>'+
  '<div id="comment-list" class="comment-list"><div class="comment-empty">Chargement des échanges…</div></div>'+
  '<div class="comment-form">'+
   '<div class="comment-tools"><select id="comment-kind" aria-label="Type de commentaire">'+
    '<option value="observation">Observation</option><option value="question">Question</option><option value="decision">Décision</option><option value="action">Action</option><option value="source">Source</option>'+
   '</select></div>'+
   '<textarea id="comment-body" placeholder="Ajouter une info utile, une question, une décision… Utilise @prenom pour interpeller quelqu’un."></textarea>'+
   '<div class="mention-chips">'+memberSuggestions().map(function(x){return '<button type="button" onclick="insertMention(\''+esc(x)+'\')">@'+esc(x)+'</button>';}).join('')+'</div>'+
   '<div class="comment-submit"><span class="comment-hint">Fil centré qualification, pas chat général.</span><button type="button" onclick="submitComment()">Publier</button></div>'+
  '</div>'+
 '</div>';
}
function renderComments(it){
 var el=document.getElementById('comment-list'), mode=document.getElementById('thread-mode');
 if(!el) return;
 var rows=(COMMENTS[cmtKey(it)]||[]).slice().sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
 if(mode) mode.textContent=CMT_MODE==='supabase'?'partagé équipe':'local navigateur';
 if(!rows.length){ el.innerHTML='<div class="comment-empty">Aucun échange sur ce lieu. Ajoute la première info fiable ou la prochaine action.</div>'; return; }
 el.innerHTML=rows.slice(0,8).map(function(c){
  return '<div class="comment"><div class="comment-meta"><span class="comment-kind '+esc(c.kind||'observation')+'">'+kindLabel(c.kind)+'</span><span>'+esc(initials(c.email))+'</span><span>'+fmtDate(c.created_at)+'</span></div><div>'+linkMentions(c.body)+'</div></div>';
 }).join('');
}
async function loadComments(it){
 var k=cmtKey(it); COMMENTS[k]=[];
 if(sbFav && ME){
  try{
   var r=await sbFav.from('commentaires_lieux').select('id,lieu,nom,email,kind,body,mentions,created_at').eq('lieu',k).order('created_at',{ascending:false}).limit(25);
   if(!r.error && r.data){ COMMENTS[k]=r.data; CMT_MODE='supabase'; renderComments(it); return; }
  }catch(e){}
 }
 CMT_MODE='local';
 var s=cmtStore(); COMMENTS[k]=s[k]||[]; renderComments(it);
}
function insertMention(name){
 var ta=document.getElementById('comment-body'); if(!ta) return;
 var ins='@'+name+' ';
 var start=ta.selectionStart||ta.value.length, end=ta.selectionEnd||start;
 ta.value=ta.value.slice(0,start)+ins+ta.value.slice(end);
 ta.focus(); ta.selectionStart=ta.selectionEnd=start+ins.length;
}
async function submitComment(){
 if(!CUR) return;
 var ta=document.getElementById('comment-body'), sel=document.getElementById('comment-kind');
 if(!ta) return;
 var body=(ta.value||'').trim(); if(!body) return;
 var k=cmtKey(CUR);
 var row={lieu:k,nom:CUR.n,email:ME||'local',kind:(sel&&sel.value)||'observation',body:body,mentions:parseMentions(body),created_at:new Date().toISOString()};
 if(CMT_MODE==='supabase' && sbFav && ME){
  try{ var r=await sbFav.from('commentaires_lieux').insert(row).select().single(); if(!r.error && r.data) row=r.data; }catch(e){}
 }
 if(CMT_MODE!=='supabase'){
  var s=cmtStore(); s[k]=s[k]||[]; s[k].push(row); saveCmtStore(s);
 }
 COMMENTS[k]=(COMMENTS[k]||[]).concat([row]); ta.value=''; renderComments(CUR);
}
function closePanel(){ document.getElementById('panel').classList.remove('open'); document.body.classList.remove('panel-open'); setTimeout(function(){ map.invalidateSize(); },260); }
document.addEventListener('keydown',function(e){
 if(e.key==='Escape') closePanel();
 else if(e.key==='ArrowLeft') phMove(-1);
 else if(e.key==='ArrowRight') phMove(1);
});

var SB_URL='https://lsdnwszhdsgwzloxdnyt.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZG53c3poZHNnd3psb3hkbnl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMjkyNTgsImV4cCI6MjA5ODcwNTI1OH0.5bidFmPJwIhLi9JQcceI1PSQKXHykKD8rwdgcV2PwFc';
var sbFav=null; try{ sbFav=window.supabase&&window.supabase.createClient(SB_URL,SB_KEY); }catch(e){}
var ME=null, FAV={}, FAV_MODE='local', LS_KEY='lumignis_favoris_v1', CUR=null;
function favKey(it){ return (it.n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,90); }
function favEmails(it){ return FAV[favKey(it)]||[]; }
function isFav(it){ return favEmails(it).length>0; }
function mineFav(it){ return !!(ME && favEmails(it).indexOf(ME)>=0); }
function loadLocal(){ FAV={}; try{ (JSON.parse(localStorage.getItem(LS_KEY)||'[]')||[]).forEach(function(k){FAV[k]=['local'];}); }catch(e){} }
async function loadFav(){
  if(sbFav){
    try{
      var s=await sbFav.auth.getSession();
      ME=(s&&s.data&&s.data.session&&s.data.session.user&&s.data.session.user.email)||null;
      if(ME){
        var r=await sbFav.from('favoris').select('lieu,email');
        if(!r.error && r.data){ FAV={}; r.data.forEach(function(row){ (FAV[row.lieu]=FAV[row.lieu]||[]).push(row.email); }); FAV_MODE='supabase'; return; }
      }
    }catch(e){}
  }
  FAV_MODE='local'; loadLocal();
}
async function toggleFav(it){
  if(!it) return; var k=favKey(it);
  if(FAV_MODE==='supabase'){
    if(mineFav(it)){ FAV[k]=favEmails(it).filter(function(e){return e!==ME;}); try{ await sbFav.from('favoris').delete().eq('lieu',k).eq('email',ME); }catch(e){} }
    else { FAV[k]=favEmails(it).concat([ME]); try{ await sbFav.from('favoris').insert({lieu:k,email:ME,nom:it.n}); }catch(e){} }
  } else {
    if(isFav(it)) delete FAV[k]; else FAV[k]=['local'];
    try{ localStorage.setItem(LS_KEY, JSON.stringify(Object.keys(FAV))); }catch(e){}
  }
  styleMarker(it); if(CUR && favKey(CUR)===k) syncPanelStar(it); refresh();
}
function styleMarker(it){ if(!it||it._piste) return; var m=it._m; if(!m) return; if(isFav(it)) m.setStyle({color:'#bd8a3e',weight:3.2}); else m.setStyle({color:'#fff',weight:1.5}); }
function favBtnHtml(it){
  var mine=mineFav(it), any=isFav(it), n=favEmails(it).length;
  var label = FAV_MODE==='local'
    ? (any?'★ Favori':'☆ Ajouter aux favoris')
    : (mine?'★ Dans la short-list':(any?'☆ +1 (retenu par l\'équipe)':'☆ Ajouter à la short-list'));
  var who = (FAV_MODE!=='local' && any) ? '<div class="fav-who">Retenu par '+n+' membre'+(n>1?'s':'')+(mine?', dont toi':'')+'.</div>' : '';
  var on = mine || (FAV_MODE==='local'&&any);
  return '<button class="fav-btn'+(on?' on':'')+'" id="fav-btn" type="button" onclick="toggleFav(CUR)"><span class="st">'+(any?'★':'☆')+'</span> <span>'+label+'</span></button>'+who;
}
function syncPanelStar(it){ var el=document.getElementById('fav-slot'); if(el) el.innerHTML=favBtnHtml(it); }

var PISTES=[];
var markers=[], pisteMarkers=[];
function fallbackQualifs(){
 var el=document.getElementById('qualif-fallback');
 if(!el) return {};
 var txt=(el.textContent||'').trim();
 if(!txt || txt.indexOf('[]')>=0) return {};
 try{
  var rows=JSON.parse(txt), map={};
  rows.forEach(function(row){ if(row&&row.id) map[row.id]=row; });
  return map;
 }catch(e){ return {}; }
}
function buildAll(){
 DATA.forEach(function(it){
  if(it.lat==null||it.lng==null) return;
  var m=L.circleMarker([it.lat,it.lng],{radius:rad(it.imp),color:"#fff",weight:1.5,fillColor:COLS[it.t],fillOpacity:.88});
  it._m=m; m._it=it;
  m.bindTooltip(tipHtml(it,null),{className:'s-tip',sticky:true,direction:'top',opacity:1});
  m.on('click',function(){ openPanel(it); });
  m.addTo(map); markers.push(m);
 });
 PISTES.forEach(function(p){
  if(p.lat==null||p.lng==null) return;
  p.t='p'; p._piste=true; p.n=p.nom; p.c=p.zone; p.d=''; p.r=p.zone;
  var m=L.circleMarker([p.lat,p.lng],{radius:9,color:'#fff',weight:2,fillColor:PTIER[p.tier]||'#888',fillOpacity:1});
  p._m=m; m._it=p;
  m.bindTooltip('<div class="tip-in tip-min"><div class="tip-nm">'+esc(p.nom)+'</div><div class="tip-sub" style="color:#a06a1f">\u25c6 Piste \u00e9quipe \u00b7 '+PTIER_L[p.tier]+'</div><div class="tip-line">'+esc(p.zone)+' \u00b7 '+esc(p.angle)+'</div></div>',{className:'s-tip',sticky:true,direction:'top',opacity:1});
  m.on('click',function(){ openPiste(p); });
  m.addTo(map); markers.push(m); pisteMarkers.push(p);
 });
}
var search=document.getElementById('search'), count=document.getElementById('count');
var cbS=document.getElementById('cb-s'), cbA=document.getElementById('cb-a'), cbV=document.getElementById('cb-v');
var cbP=document.getElementById('cb-p');
var cbFav=document.getElementById('cb-fav'), favLine=document.getElementById('fav-line');
function refresh(){
 var q=(search.value||'').toLowerCase().trim(); var ns=0, na=0, nv=0, np=0; var onlyFav=cbFav&&cbFav.checked;
 markers.forEach(function(m){ var it=m._it;
   var typeOk=(it.t==='p'?(!cbP||cbP.checked):(it.t==='s'?cbS.checked:(it.t==='a'?cbA.checked:cbV.checked)));
   var favOk=(!onlyFav || isFav(it));
   var hay=it.n+' '+it.c+' '+it.d+' '+it.r+(it.o?' '+it.o:'')+(it.prix?' '+it.prix+' \u00e0 vendre':'')+(it.desc?' '+it.desc:'');
   var hit=typeOk && favOk && (!q || hay.toLowerCase().indexOf(q)>=0);
   if(hit){ if(!map.hasLayer(m)) m.addTo(map); if(it.t==='s')ns++; else if(it.t==='a')na++; else if(it.t==='p')np++; else nv++; }
   else { if(map.hasLayer(m)) map.removeLayer(m); }
 });
 count.textContent = markers.length ? (ns+' sanctuaires \u00b7 '+na+' abbayes \u00b7 '+nv+' \u00e0 reprendre'+(np?' \u00b7 '+np+' piste'+(np>1?'s':'')+' \u00e9quipe':'')) : '';
 if(favLine){
   var total=Object.keys(FAV).filter(function(k){return (FAV[k]||[]).length;}).length;
   var tag = FAV_MODE==='supabase' ? '\u2605 '+total+' en short-list d\'\u00e9quipe'+(ME?' \u00b7 '+ME:'') : (total?'\u2605 '+total+' favori'+(total>1?'s':'')+' (perso)':'');
   favLine.textContent=tag;
 }
}
function fitAll(){
 var pts=markers.map(function(m){return m._it;}).filter(function(it){return it&&it.lat!=null&&it.lng!=null;}).map(function(it){return [it.lat,it.lng];});
 if(pts.length){ map.fitBounds(L.latLngBounds(pts),{padding:[24,24],maxZoom:7}); } else { map.setView([46.7,2.4],6); }
}
search.addEventListener('input',refresh); cbS.addEventListener('change',refresh); cbA.addEventListener('change',refresh); cbV.addEventListener('change',refresh);
if(cbFav) cbFav.addEventListener('change',refresh);
if(cbP) cbP.addEventListener('change',refresh);
var rc=document.getElementById('recenter'); if(rc) rc.addEventListener('click',fitAll);
window.addEventListener('resize',function(){ map.invalidateSize(); });
async function loadData(){
 DATA.length=0; PISTES.length=0;
  try{
   if(sbFav){ try{ await sbFav.auth.getSession(); }catch(e){} }
   var qmap=fallbackQualifs();
   QUALIF_LOADED=Object.keys(qmap).length>0;
   if(sbFav){
     try{
       var qr=await sbFav.from('lieux_qualifications').select('lieu_id,data');
       if(qr && !qr.error && qr.data){ qr.data.forEach(function(row){ qmap[row.lieu_id]=row.data; }); QUALIF_LOADED=qr.data.length>0; }
     }catch(e){}
   }
   var r = sbFav ? await sbFav.from('carte_lieux').select('id,t,data').order('sort') : {data:null};
   if(r && !r.error && r.data){ r.data.forEach(function(row){ var o=row.data||{}; o.qid=row.id; if(qmap[row.id]) o.qualif=qmap[row.id]; if(row.t==='p') PISTES.push(o); else DATA.push(o); }); }
 }catch(e){}
}
loadData().then(function(){ buildAll(); return loadFav(); }).then(function(){
 markers.forEach(function(m){ styleMarker(m._it); });
 refresh();
 if(!markers.length){ count.textContent='Connecte-toi \u00e0 l\'espace \u00e9quipe pour afficher les lieux.'; }
 setTimeout(function(){ map.invalidateSize(); if(markers.length) fitAll(); },90);
});
